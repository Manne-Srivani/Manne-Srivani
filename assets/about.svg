<rect width="900" height="300" rx="18" fill="url(#bg)"/><rect x=".75" y=".75" width="898.5" height="298.5" rx="18" fill="none" stroke="#22d3ee" stroke-opacity=".25"/><text x="45" y="62" font-size="21" font-weight="600" fill="#f1f5f9">I turn ideas into fast, scalable, production-ready web applications.</text><rect x="45" y="76" width="60" height="3" rx="2" fill="url(#acc)"><animate attributeName="width" values="40;260;40" dur="5s" repeatCount="indefinite"/></rect><g class="r" style="animation-delay:0.30s"><circle cx="52" cy="120" r="5" fill="#22d3ee"><animate attributeName="r" values="4;6.5;4" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></circle><text x="72" y="125" font-size="15.5" fill="#cbd5e1">Frontend Developer / Software Test Engineer at Mr Chams Pvt. Ltd.</text></g><g class="r" style="animation-delay:0.55s"><circle cx="52" cy="153" r="5" fill="#a78bfa"><animate attributeName="r" values="4;6.5;4" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></circle><text x="72" y="158" font-size="15.5" fill="#cbd5e1">Building UIs with React.js, Next.js &amp; JavaScript (ES6+), backed by Node.js, REST APIs &amp; MySQL</text></g><g class="r" style="animation-delay:0.80s"><circle cx="52" cy="186" r="5" fill="#34d399"><animate attributeName="r" values="4;6.5;4" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle><text x="72" y="191" font-size="15.5" fill="#cbd5e1">SEO-first architecture: Schema.org, Open Graph, canonical URLs &amp; dynamic routing</text></g><g class="r" style="animation-delay:1.05s"><circle cx="52" cy="219" r="5" fill="#fbbf24"><animate attributeName="r" values="4;6.5;4" dur="2.4s" begin="0.8999999999999999s" repeatCount="indefinite"/></circle><text x="72" y="224" font-size="15.5" fill="#cbd5e1">Quality mindset: Selenium WebDriver, TestNG &amp; Page Object Model</text></g><g class="r" style="animation-delay:1.30s"><circle cx="52" cy="252" r="5" fill="#60a5fa"><animate attributeName="r" values="4;6.5;4" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle><text x="72" y="257" font-size="15.5" fill="#cbd5e1">M.Sc. Computer Science, with strong foundations in Data Structures, OOP &amp; QA</text></g>
